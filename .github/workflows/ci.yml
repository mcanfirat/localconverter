name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only ever reads the tree — it publishes nothing and needs no secrets.
# Stated explicitly so that a change to the repository-wide default cannot
# silently hand a build job a token that can write to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint and typecheck once — they are platform independent, so running them on
  # four runners would just be four times the CO2 for the same answer.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", os: ubuntu-22.04 }
          - { name: "macOS ARM", os: macos-14 }
          - { name: "macOS Intel", os: macos-13 }
          - { name: "Windows x64", os: windows-latest }
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The Tauri integration test binary imports WebView2Loader.dll, but
      # `cargo test` leaves that DLL where webview2-com-sys built it — under
      # target\debug\build\…\out\x64 — and never beside the test executables.
      # Windows then resolves the name against a system-wide copy whose
      # exports do not match, and the process dies before main() with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) rather than a missing-DLL
      # error. The executable's own directory is first in the DLL search
      # order, so putting the right build's copy there fixes it.
      # Only `cargo test` needs this; `tauri build` bundles the DLL itself.
      - name: Windows — put WebView2Loader.dll beside the test binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --workspace --tests
          $dll = Get-ChildItem -Recurse -Filter WebView2Loader.dll target\debug\build |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll (x64) not found under target\debug\build" }
          New-Item -ItemType Directory -Force -Path target\debug\deps | Out-Null
          Copy-Item $dll.FullName target\debug\deps\ -Force
          Copy-Item $dll.FullName target\debug\ -Force
          Write-Host "copied $($dll.FullName)"

      - run: cargo test --workspace

      # `cargo test` regenerates the TypeScript contracts via ts-rs. A dirty tree
      # here means the committed bindings no longer match the Rust types.
      - name: Generated bindings are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- apps/desktop/src/bindings; then
            echo "::error::apps/desktop/src/bindings is stale. Run 'cargo test' and commit the result."
            exit 1
          fi

  build:
    name: Package · ${{ matrix.name }}
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", os: ubuntu-22.04 }
          - { name: "macOS ARM", os: macos-14 }
          - { name: "macOS Intel", os: macos-13 }
          - { name: "Windows x64", os: windows-latest }
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug

      - uses: actions/upload-artifact@v4
        with:
          name: localconvert-${{ matrix.os }}
          path: |
            target/debug/bundle/**/*
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Licenses, advisories, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-sbom
      - run: cargo deny check
      - run: cargo sbom > localconvert-sbom.spdx.json

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: localconvert-sbom.spdx.json
