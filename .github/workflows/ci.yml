name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint and typecheck once — they are platform independent, so running them on
  # four runners would just be four times the CO2 for the same answer.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", os: ubuntu-22.04 }
          - { name: "macOS ARM", os: macos-14 }
          - { name: "macOS Intel", os: macos-13 }
          - { name: "Windows x64", os: windows-latest }
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # `cargo test` regenerates the TypeScript contracts via ts-rs. A dirty tree
      # here means the committed bindings no longer match the Rust types.
      - name: Generated bindings are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- apps/desktop/src/bindings; then
            echo "::error::apps/desktop/src/bindings is stale. Run 'cargo test' and commit the result."
            exit 1
          fi

  build:
    name: Package · ${{ matrix.name }}
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", os: ubuntu-22.04 }
          - { name: "macOS ARM", os: macos-14 }
          - { name: "macOS Intel", os: macos-13 }
          - { name: "Windows x64", os: windows-latest }
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug

      - uses: actions/upload-artifact@v4
        with:
          name: localconvert-${{ matrix.os }}
          path: |
            target/debug/bundle/**/*
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Licenses, advisories, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-sbom
      - run: cargo deny check
      - run: cargo sbom > localconvert-sbom.spdx.json

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: localconvert-sbom.spdx.json
