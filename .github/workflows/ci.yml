name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only ever reads the tree — it publishes nothing and needs no secrets.
# Stated explicitly so that a change to the repository-wide default cannot
# silently hand a build job a token that can write to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint and typecheck once — they are platform independent, so running them on
  # four runners would just be four times the CO2 for the same answer.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", os: ubuntu-22.04 }
          - { name: "macOS ARM", os: macos-14 }
          - { name: "Windows x64", os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'macos-14' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # Intel macOS used to be its own matrix entry on `macos-13`. GitHub
      # retired that runner image, so the job never got picked up — it sat
      # queued for hours and held the packaging jobs behind it, which is worse
      # than having no Intel entry at all.
      #
      # Cross-compiling from the ARM runner keeps the part that actually caught
      # things: that the workspace still builds for x86_64. It cannot run the
      # tests on Intel — that needs an Intel host — so this is deliberately a
      # compile check and is described as one in docs/TESTING.md.
      - name: Intel macOS cross-compiles
        if: matrix.os == 'macos-14'
        run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings

      # `cargo test` regenerates the TypeScript contracts via ts-rs. A dirty tree
      # here means the committed bindings no longer match the Rust types.
      - name: Generated bindings are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- apps/desktop/src/bindings; then
            echo "::error::apps/desktop/src/bindings is stale. Run 'cargo test' and commit the result."
            exit 1
          fi

  build:
    name: Package · ${{ matrix.name }}
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", os: ubuntu-22.04, args: "" }
          # One macOS entry, not two: a universal binary carries both
          # architectures, so this replaces the ARM and the retired Intel job
          # and produces the bundle an Intel user can actually run.
          - { name: "macOS universal", os: macos-14, args: "--target universal-apple-darwin" }
          - { name: "Windows x64", os: windows-latest, args: "" }
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: localconvert-${{ matrix.name }}
          path: |
            target/debug/bundle/**/*
            target/*/debug/bundle/**/*
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Licenses, advisories, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-sbom
      - run: cargo deny check
      - run: cargo sbom > localconvert-sbom.spdx.json

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: localconvert-sbom.spdx.json
