[package]
name = "localconvert-core"
description = "Domain contracts, job state machine, safe path handling and temporary workspace management for LocalConvert."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
calamine = { version = "0.30", features = ["dates"] }
chrono.workspace = true
csv = "1"
encoding_rs = "0.8"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif", "rayon"] }
imagesize = "0.15"
kamadak-exif = "0.6"
lopdf = { version = "0.36", default-features = false, features = ["embed_image"] }
rust_xlsxwriter = "0.92"
serde.workspace = true
serde_json.workspace = true
tar = "0.4"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true
zip = { version = "4", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
