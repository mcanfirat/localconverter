# cargo-deny: license and advisory policy.
# Runs in CI (`supply-chain` job). Adding a dependency with an unlisted license
# is a build failure, not a review comment.

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only. A copyleft dependency changes the obligations for
# the whole distributed bundle, so it is a deliberate decision rather than a
# transitive surprise. The FFmpeg build variant in Phase 5 is exactly this
# question — see docs/PACKAGING.md.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
